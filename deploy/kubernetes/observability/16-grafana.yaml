# Grafana with provisioned datasources (Prometheus/Loki/Tempo, cross-linked
# via trace_id) and the Halon gateway dashboard. The admin password below is
# a local-development default — override it before exposing the service.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: observability
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: halon-observability
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        url: http://prometheus.observability.svc.cluster.local:9090
        isDefault: true
      - name: Loki
        uid: loki
        type: loki
        url: http://loki.observability.svc.cluster.local:3100
        jsonData:
          derivedFields:
            # Jump from a gateway access log line to its trace in Tempo.
            - datasourceUid: tempo
              matcherRegex: "trace_id=(\\w+)"
              name: TraceID
              url: "$${__value.raw}"
      - name: Tempo
        uid: tempo
        type: tempo
        url: http://tempo.observability.svc.cluster.local:3200
        jsonData:
          tracesToLogsV2:
            datasourceUid: loki
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: observability
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: halon-observability
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: halon
        folder: Halon
        type: file
        disableDeletion: false
        updateIntervalSeconds: 30
        options:
          path: /var/lib/grafana/dashboards
  halon-gateway.json: |
    {
      "title": "Halon Gateway",
      "uid": "halon-gateway",
      "schemaVersion": 39,
      "timezone": "browser",
      "refresh": "30s",
      "time": { "from": "now-1h", "to": "now" },
      "panels": [
        {
          "id": 1, "type": "timeseries", "title": "Request rate by route",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [{ "refId": "A", "legendFormat": "{{route}}",
            "expr": "sum by (route) (rate(halon_gateway_http_requests_total[5m]))" }],
          "fieldConfig": { "defaults": { "unit": "reqps" }, "overrides": [] }
        },
        {
          "id": 2, "type": "timeseries", "title": "Server error rate (5xx)",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [{ "refId": "A", "legendFormat": "{{route}} {{status}}",
            "expr": "sum by (route, status) (rate(halon_gateway_http_requests_total{status=~\"5..\"}[5m]))" }],
          "fieldConfig": { "defaults": { "unit": "reqps" }, "overrides": [] }
        },
        {
          "id": 3, "type": "timeseries", "title": "Latency P95 / P99",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "refId": "A", "legendFormat": "p95 {{route}}",
              "expr": "histogram_quantile(0.95, sum by (le, route) (rate(halon_gateway_http_request_duration_seconds_bucket[5m])))" },
            { "refId": "B", "legendFormat": "p99 {{route}}",
              "expr": "histogram_quantile(0.99, sum by (le, route) (rate(halon_gateway_http_request_duration_seconds_bucket[5m])))" }
          ],
          "fieldConfig": { "defaults": { "unit": "s" }, "overrides": [] }
        },
        {
          "id": 4, "type": "stat", "title": "Circuit breakers (0=closed 1=half-open 2=open)",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [{ "refId": "A", "legendFormat": "{{route}}",
            "expr": "halon_gateway_circuit_breaker_state" }]
        },
        {
          "id": 5, "type": "timeseries", "title": "Rejections / retries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 16 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "refId": "A", "legendFormat": "rejected {{reason}}",
              "expr": "sum by (reason) (rate(halon_gateway_rejected_requests_total[5m]))" },
            { "refId": "B", "legendFormat": "retries {{route}}",
              "expr": "sum by (route) (rate(halon_gateway_retries_total[5m]))" }
          ],
          "fieldConfig": { "defaults": { "unit": "reqps" }, "overrides": [] }
        },
        {
          "id": 6, "type": "timeseries", "title": "In-flight / queue drops",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 16 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "refId": "A", "legendFormat": "in-flight",
              "expr": "halon_gateway_in_flight_requests" },
            { "refId": "B", "legendFormat": "trafficlog drops",
              "expr": "rate(halon_gateway_trafficlog_dropped_total[5m])" },
            { "refId": "C", "legendFormat": "timeout event drops",
              "expr": "rate(halon_gateway_timeout_events_dropped_total[5m])" }
          ]
        }
      ]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: observability
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: halon-observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
        app.kubernetes.io/part-of: halon-observability
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: grafana
          image: grafana/grafana:11.6.0
          imagePullPolicy: IfNotPresent
          env:
            # Local-development default; change before exposing the service.
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: halon-admin
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
              readOnly: true
            - name: dashboards
              mountPath: /etc/grafana/provisioning/dashboards
              readOnly: true
            - name: dashboard-json
              mountPath: /var/lib/grafana/dashboards
              readOnly: true
            - name: data
              mountPath: /var/lib/grafana
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 6
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 472
            runAsGroup: 472
            capabilities:
              drop:
                - ALL
      volumes:
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboards
          configMap:
            name: grafana-dashboards
            items:
              - key: dashboards.yaml
                path: dashboards.yaml
        - name: dashboard-json
          configMap:
            name: grafana-dashboards
            items:
              - key: halon-gateway.json
                path: halon-gateway.json
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: observability
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: halon-observability
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: grafana
  ports:
    - name: http
      port: 3000
      targetPort: http
      protocol: TCP
