# Optional Halon Web Console: serves the Google-style React UI and proxies
# /api/gateway/* -> gateway-admin:9090 and /api/agent/* -> agent:8081.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: halon-web
  labels:
    app.kubernetes.io/name: halon-web
    app.kubernetes.io/part-of: halon
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: halon-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: halon-web
        app.kubernetes.io/part-of: halon
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: halon/web:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /var/cache/nginx
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
            capabilities:
              drop:
                - ALL
      volumes:
        - name: tmp
          emptyDir: {}
        - name: cache
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: halon-web
  labels:
    app.kubernetes.io/name: halon-web
    app.kubernetes.io/part-of: halon
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: halon-web
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
