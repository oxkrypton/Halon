apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/part-of: halon
spec:
  # Keep one replica while blacklist and rate-limit state is memory-local.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gateway
        app.kubernetes.io/part-of: halon
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: halon/gateway:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: admin
              containerPort: 9090
              protocol: TCP
          env:
            - name: GIN_MODE
              value: release
            # Route table: prefix=upstream pairs. The demo entry below only
            # works when examples/user-service is deployed; replace it with
            # your own services.
            - name: ROUTES
              value: /api/v1/users/=http://user-service:8090,/api/v1/orders/=http://order-service:8092
            - name: UPSTREAM_TIMEOUT
              value: 3s
            - name: RATE_LIMIT_RPS
              value: "20"
            - name: RATE_LIMIT_BURST
              value: "40"
            - name: DATABASE_DSN
              valueFrom:
                secretKeyRef:
                  name: halon-secrets
                  key: database-dsn
            - name: ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: halon-secrets
                  key: admin-token
            - name: AGENT_WEBHOOK_URL
              value: http://agent:8081/api/v1/incidents/timeout
            - name: AGENT_WEBHOOK_TOKEN
              valueFrom:
                secretKeyRef:
                  name: halon-secrets
                  key: ingest-token
            # Distributed tracing is off by default. After deploying the
            # observability stack (make deploy-observability), uncomment:
            # - name: OTEL_ENABLED
            #   value: "true"
            # - name: OTEL_EXPORTER_OTLP_ENDPOINT
            #   value: otel-collector.observability.svc.cluster.local:4317
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 15
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 192Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/part-of: halon
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: gateway
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-admin
  labels:
    app.kubernetes.io/name: gateway-admin
    app.kubernetes.io/part-of: halon
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: gateway
  ports:
    - name: admin
      port: 9090
      targetPort: admin
      protocol: TCP
