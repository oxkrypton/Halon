apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent
  labels:
    app.kubernetes.io/name: agent
    app.kubernetes.io/part-of: halon
---
# Least-privilege read access plus the mutations the operator tools need,
# scoped to this namespace only.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agent
  labels:
    app.kubernetes.io/name: agent
    app.kubernetes.io/part-of: halon
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agent
  labels:
    app.kubernetes.io/name: agent
    app.kubernetes.io/part-of: halon
subjects:
  - kind: ServiceAccount
    name: agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: agent
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent
  labels:
    app.kubernetes.io/name: agent
    app.kubernetes.io/part-of: halon
spec:
  # Memory mode (default): single replica because action cooldowns are
  # memory-local (event dedup is safe at any replica count — the database
  # unique constraint arbitrates). With REDIS_URL set on BOTH gateway and
  # agent (shared mode), 2+ replicas are safe.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent
        app.kubernetes.io/part-of: halon
    spec:
      serviceAccountName: agent
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agent
          image: halon/agent:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8081
              protocol: TCP
          env:
            - name: GIN_MODE
              value: release
            - name: AGENT_OPERATION_LEVEL
              value: readonly
            - name: K8S_NAMESPACES
              value: default
            - name: GATEWAY_ADMIN_URL
              value: http://gateway-admin:9090
            - name: OPENAI_BASE_URL
              value: https://api.openai.com/v1
            - name: OPENAI_MODEL
              value: gpt-4o-mini
            - name: DATABASE_DSN
              valueFrom:
                secretKeyRef:
                  name: halon-secrets
                  key: database-dsn
            - name: INGEST_TOKEN
              valueFrom:
                secretKeyRef:
                  name: halon-secrets
                  key: ingest-token
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: halon-secrets
                  key: openai-api-key
            - name: GATEWAY_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: halon-secrets
                  key: admin-token
            # Shared-state mode is off by default. After deploying Redis
            # (make deploy-redis) uncomment on BOTH gateway and agent,
            # then replicas may be raised above 1:
            # - name: REDIS_URL
            #   value: redis://redis:6379/0
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 15
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 192Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: agent
  labels:
    app.kubernetes.io/name: agent
    app.kubernetes.io/part-of: halon
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: agent
  ports:
    - name: http
      port: 8081
      targetPort: http
      protocol: TCP
